<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SolLotto — Devnet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/@solana/web3.js@1.91.8/lib/index.iife.min.js"></script>
  <style>
    /* ... exactamente el mismo CSS que tenías ... */
    :root {
      --bg:         #060910;
      --surface:    #0c1120;
      --card:       #101828;
      --border:     #1a2540;
      --border-hi:  #2a3f6f;
      --primary:    #6366f1;
      --primary-hi: #818cf8;
      --gold:       #f59e0b;
      --gold-hi:    #fcd34d;
      --green:      #10b981;
      --green-hi:   #34d399;
      --red:        #ef4444;
      --red-hi:     #f87171;
      --text:       #e2e8f0;
      --muted:      #64748b;
      --muted-hi:   #94a3b8;
      --font:       'Josefin Sans', sans-serif;
      --mono:       'Space Mono', monospace;
    }
    /* ... (todo el CSS original sin cambios) ... */
  </style>
</head>
<body>
<div id="root">
  <!-- ... exactamente el mismo HTML que tenías ... -->
</div>

<script>
// ══════════════════════════════════════════════
//  CONFIG — Program ID fijo
// ══════════════════════════════════════════════
const {
  Connection, PublicKey, Transaction, TransactionInstruction,
  SystemProgram, LAMPORTS_PER_SOL, clusterApiUrl
} = solanaWeb3;

const PROGRAM_ID   = new PublicKey("27WmZciMu23KeTEmtYQxKtAMc4TUjZ3BT6853M5rB8g5");
const EXPLORER_URL = (sig) => `https://explorer.solana.com/tx/${sig}?cluster=devnet`;
const ADDR_URL     = (addr) => `https://explorer.solana.com/address/${addr}?cluster=devnet`;
const connection   = new Connection(clusterApiUrl("devnet"), "confirmed");

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let walletPubkey  = null;
let lotteryState  = null;
let myTickets     = 0;
let refreshTimer  = null;
let countdownVal  = 10;
let countdownInt  = null;
let busy          = false;

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
const enc = (s) => new TextEncoder().encode(s);

async function discriminator(name) {
  const hash = await crypto.subtle.digest("SHA-256", enc(`global:${name}`));
  return new Uint8Array(hash).slice(0, 8);
}

function u64LE(value) {
  const buf = new ArrayBuffer(8);
  new DataView(buf).setBigUint64(0, BigInt(value), true);
  return new Uint8Array(buf);
}

function readU64(bytes, off) {
  return new DataView(bytes.buffer, bytes.byteOffset + off, 8).getBigUint64(0, true);
}

function concat(...arrs) {
  const len = arrs.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(len); let i = 0;
  for (const a of arrs) { out.set(a, i); i += a.length; }
  return out;
}

function fmtSOL(lamports, decimals = 4) {
  return (Number(lamports) / LAMPORTS_PER_SOL).toFixed(decimals) + " SOL";
}

function short(pk, n = 5) {
  const s = pk.toBase58(); return s.slice(0, n) + "…" + s.slice(-n);
}

// ══════════════════════════════════════════════
//  PDAs  ← CORREGIDO
// ══════════════════════════════════════════════
function lotteryPDA() {
  const [pda] = PublicKey.findProgramAddressSync([enc("lottery")], PROGRAM_ID);
  return pda;
}

// CORRECCIÓN: La PDA del ticket solo usa el ID, no el comprador.
function ticketPDA(id) {
  const [pda] = PublicKey.findProgramAddressSync(
    [enc("ticket"), u64LE(id)],
    PROGRAM_ID
  );
  return pda;
}

// ══════════════════════════════════════════════
//  ACCOUNT DECODE (sin cambios)
// ══════════════════════════════════════════════
function decodeLottery(raw) {
  const b = new Uint8Array(raw); const o = 8;
  return {
    admin:        new PublicKey(b.slice(o,      o+32)),
    ticketPrice:  readU64(b, o+32),
    totalTickets: readU64(b, o+40),
    totalPrize:   readU64(b, o+48),
    isActive:     b[o+56] === 1,
    winner:       new PublicKey(b.slice(o+57,   o+89)),
  };
}

// ══════════════════════════════════════════════
//  FETCH STATE (sin cambios)
// ══════════════════════════════════════════════
async function fetchState() {
  if (!walletPubkey) return;
  resetCountdown();
  try {
    const bal  = await connection.getBalance(walletPubkey);
    el("user-bal").textContent = (bal / LAMPORTS_PER_SOL).toFixed(4);

    const info = await connection.getAccountInfo(lotteryPDA());
    lotteryState = info ? decodeLottery(info.data) : null;
    renderDashboard();
  } catch (e) {
    console.error(e);
    toast("e", "RPC ERROR", e.message.slice(0, 80));
  }
}

// ══════════════════════════════════════════════
//  RENDER (sin cambios)
// ══════════════════════════════════════════════
function renderDashboard() {
  const ZERO = "11111111111111111111111111111111";

  if (!lotteryState) {
    el("not-init-section").style.display = "block";
    el("lottery-data").style.display     = "none";
    el("buy-wrap").style.display         = "none";
    el("inactive-wrap").style.display    = "block";
    el("admin-wrap").style.display       = "none";
    el("hero-prize").textContent         = "0.0000";
    el("hero-tickets").textContent       = "0";
    el("hero-price").textContent         = "—";
    el("hero-status").innerHTML          = '';
    return;
  }

  const { admin, ticketPrice, totalTickets, totalPrize, isActive, winner } = lotteryState;
  const isAdmin = walletPubkey && admin.toBase58() === walletPubkey.toBase58();

  // Hero
  el("hero-prize").textContent   = (Number(totalPrize) / LAMPORTS_PER_SOL).toFixed(4);
  el("hero-tickets").textContent = totalTickets.toString();
  el("hero-price").textContent   = fmtSOL(ticketPrice, 2);
  el("hero-status").outerHTML    = isActive
    ? `<span id="hero-status" class="prize-status active"><span class="pdot"></span>ACTIVA</span>`
    : `<span id="hero-status" class="prize-status closed">CERRADA</span>`;

  // Stats
  el("not-init-section").style.display = "none";
  el("lottery-data").style.display     = "block";
  el("d-price").textContent            = fmtSOL(ticketPrice, 2);
  el("d-tickets").textContent          = totalTickets.toString();
  el("d-prize").textContent            = fmtSOL(totalPrize);
  el("d-admin").textContent            = short(admin);
  el("d-status").innerHTML             = isActive
    ? '<span class="status-pill active"><span class="sdot"></span>ACTIVA</span>'
    : '<span class="status-pill closed">CERRADA</span>';

  const progEl = el("d-program");
  progEl.textContent = short(PROGRAM_ID);
  progEl.href        = ADDR_URL(PROGRAM_ID.toBase58());

  // Winner
  const hasWinner = !isActive && winner.toBase58() !== ZERO;
  el("winner-banner").style.display = hasWinner ? "block" : "none";
  if (hasWinner) el("d-winner").textContent = winner.toBase58();

  // Buy / inactive
  if (isActive) {
    el("buy-wrap").style.display     = "block";
    el("inactive-wrap").style.display = "none";
    const btn = el("btn-buy");
    btn.textContent = `COMPRAR TICKET · ${fmtSOL(ticketPrice, 2)}`;
    btn.disabled    = busy;
  } else {
    el("buy-wrap").style.display     = "none";
    el("inactive-wrap").style.display = "block";
  }

  // Admin
  if (isAdmin) {
    el("admin-wrap").style.display = "block";
    if (isActive) {
      el("btn-pick").style.display    = "inline-block";
      el("btn-restart").style.display = "none";
      el("btn-pick").disabled = busy || Number(totalTickets) === 0;
    } else {
      el("btn-pick").style.display    = "none";
      el("btn-restart").style.display = "inline-block";
      el("btn-restart").disabled = busy;
    }
  } else {
    el("admin-wrap").style.display = "none";
  }
}

// ══════════════════════════════════════════════
//  TX MODAL (sin cambios)
// ══════════════════════════════════════════════
function openTxModal(title, subtitle) {
  el("tx-title").textContent    = title;
  el("tx-subtitle").textContent = subtitle;
  el("tx-icon").textContent     = "⏳";
  el("tx-link").style.display   = "none";
  el("tx-close-btn").style.display = "none";
  setStep(1); setStep(2, "pending"); setStep(3, "pending");
  el("tx-modal").classList.add("show");
}
function closeTxModal() {
  el("tx-modal").classList.remove("show");
}
function setStep(n, state = "active") {
  const step = el(`step-${n}`);
  const icon = el(`s${n}-icon`);
  step.className = `tx-step ${state}`;
  if (state === "active")  icon.innerHTML = '<span class="mini-spin"></span>';
  if (state === "done")    icon.textContent = "✓";
  if (state === "pending") icon.textContent = "○";
  if (state === "error")   icon.textContent = "✕";
}
function txSuccess(sig) {
  el("tx-icon").textContent = "🎉";
  el("tx-title").textContent = "¡Transacción completada!";
  el("tx-subtitle").textContent = "Confirmada en Devnet";
  el("tx-link").style.display = "block";
  el("tx-explorer-link").href = EXPLORER_URL(sig);
  el("tx-explorer-link").textContent = `${sig.slice(0,14)}… Ver en Explorer ↗`;
  el("tx-close-btn").style.display = "block";
}
function txError(msg) {
  el("tx-icon").textContent = "❌";
  el("tx-title").textContent = "Error";
  el("tx-subtitle").textContent = msg.slice(0, 100);
  el("tx-close-btn").style.display = "block";
}

// ══════════════════════════════════════════════
//  SEND TX (sin cambios)
// ══════════════════════════════════════════════
async function sendTx(ixs) {
  const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash();
  const tx = new Transaction({ recentBlockhash: blockhash, feePayer: walletPubkey });
  ixs.forEach(ix => tx.add(ix));
  setStep(1, "active"); setStep(2, "pending"); setStep(3, "pending");
  const signed = await window.solana.signTransaction(tx);
  setStep(1, "done"); setStep(2, "active");
  const sig = await connection.sendRawTransaction(signed.serialize());
  setStep(2, "done"); setStep(3, "active");
  await connection.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight });
  setStep(3, "done");
  return sig;
}

// ══════════════════════════════════════════════
//  INSTRUCTIONS (handleBuy CORREGIDO)
// ══════════════════════════════════════════════
async function handleInit() {
  if (!walletPubkey || busy) return;
  busy = true; setBusy("btn-init", true);
  openTxModal("Inicializando lotería", "Creando el contrato en Devnet...");
  try {
    const disc = await discriminator("initialize");
    const data = concat(disc, u64LE(BigInt(Math.round(0.1 * LAMPORTS_PER_SOL))));
    const pda  = lotteryPDA();
    const ix   = new TransactionInstruction({
      programId: PROGRAM_ID,
      keys: [
        { pubkey: pda,                     isSigner: false, isWritable: true  },
        { pubkey: walletPubkey,            isSigner: true,  isWritable: true  },
        { pubkey: SystemProgram.programId, isSigner: false, isWritable: false },
      ],
      data,
    });
    const sig = await sendTx([ix]);
    txSuccess(sig);
    toast("s", "LOTERÍA CREADA", "La lotería está activa. ¡A por tickets! 🎉");
    await fetchState();
  } catch (e) {
    console.error(e);
    txError(e.message);
    toast("e", "ERROR", e.message.slice(0, 80));
  }
  busy = false; setBusy("btn-init", false);
}

async function handleBuy() {
  if (!walletPubkey || !lotteryState || busy) return;
  busy = true; setBusy("btn-buy", true);

  // CORRECCIÓN: se calcula el próximo ID correctamente
  const nextId = Number(lotteryState.totalTickets) + 1;
  openTxModal(`Comprando ticket #${nextId}`, `Precio: ${fmtSOL(lotteryState.ticketPrice, 2)}`);

  try {
    const disc  = await discriminator("buy_ticket");
    const pda   = lotteryPDA();
    const tPda  = ticketPDA(nextId);  // CORREGIDO: sin buyer, solo ID
    const ix    = new TransactionInstruction({
      programId: PROGRAM_ID,
      keys: [
        { pubkey: pda,                     isSigner: false, isWritable: true  },
        { pubkey: tPda,                    isSigner: false, isWritable: true  },
        { pubkey: walletPubkey,            isSigner: true,  isWritable: true  },
        { pubkey: SystemProgram.programId, isSigner: false, isWritable: false },
      ],
      data: disc,
    });
    const sig = await sendTx([ix]);
    txSuccess(sig);
    myTickets++;
    el("my-tickets-count").textContent = myTickets;
    toast("s", `TICKET #${nextId} COMPRADO`, `¡Ya tienes ${myTickets} ticket${myTickets > 1 ? "s" : ""} en esta ronda! 🎟`);
    await fetchState();
  } catch (e) {
    console.error(e);
    txError(e.message);
    toast("e", "ERROR AL COMPRAR", e.message.slice(0, 80));
  }
  busy = false;
  if (lotteryState) el("btn-buy").textContent = `COMPRAR TICKET · ${fmtSOL(lotteryState.ticketPrice, 2)}`;
  setBusy("btn-buy", false);
}

async function handleRestart() {
  if (!walletPubkey || !lotteryState || busy) return;
  if (!confirm("¿Iniciar nueva ronda? El precio del ticket se mantiene igual.")) return;
  busy = true; setBusy("btn-restart", true);
  openTxModal("Iniciando nueva ronda", "Reiniciando la lotería...");
  try {
    const disc = await discriminator("restart");
    const data = concat(disc, u64LE(BigInt(lotteryState.ticketPrice)));
    const pda  = lotteryPDA();
    const ix   = new TransactionInstruction({
      programId: PROGRAM_ID,
      keys: [
        { pubkey: pda,                     isSigner: false, isWritable: true  },
        { pubkey: walletPubkey,            isSigner: true,  isWritable: true  },
        { pubkey: SystemProgram.programId, isSigner: false, isWritable: false },
      ],
      data,
    });
    const sig = await sendTx([ix]);
    txSuccess(sig);
    myTickets = 0;
    el("my-tickets-count").textContent = 0;
    toast("s", "NUEVA RONDA INICIADA 🎲", "¡La lotería está activa!");
    await fetchState();
  } catch (e) {
    console.error(e);
    txError(e.message);
    toast("e", "ERROR", e.message.slice(0, 80));
  }
  busy = false; setBusy("btn-restart", false);
}

async function handlePickWinner() {
  if (!walletPubkey || !lotteryState || busy) return;
  if (!confirm("¿Cerrar la lotería y elegir ganador?\n\nEsta acción es irreversible.")) return;
  busy = true; setBusy("btn-pick", true);
  openTxModal("Eligiendo ganador", "Cerrando la lotería y transfiriendo el bote...");
  try {
    const disc = await discriminator("pick_winner");
    const pda  = lotteryPDA();
    const ix   = new TransactionInstruction({
      programId: PROGRAM_ID,
      keys: [
        { pubkey: pda,                     isSigner: false, isWritable: true  },
        { pubkey: walletPubkey,            isSigner: true,  isWritable: true  },
        { pubkey: walletPubkey,            isSigner: false, isWritable: true  },  // admin es también el ganador (puedes cambiarlo si quieres seleccionar otro)
        { pubkey: SystemProgram.programId, isSigner: false, isWritable: false },
      ],
      data: disc,
    });
    const sig = await sendTx([ix]);
    txSuccess(sig);
    toast("s", "¡GANADOR ELEGIDO! 🏆", "El bote ha sido transferido.");
    await fetchState();
  } catch (e) {
    console.error(e);
    txError(e.message);
    toast("e", "ERROR", e.message.slice(0, 80));
  }
  busy = false; setBusy("btn-pick", false);
}

// ══════════════════════════════════════════════
//  WALLET (sin cambios)
// ══════════════════════════════════════════════
async function handleWalletBtn() {
  walletPubkey ? disconnectWallet() : await connectWallet();
}

async function connectWallet() {
  if (!window.solana?.isPhantom) {
    el("no-phantom-msg").style.display = "block";
    return;
  }
  try {
    const resp = await window.solana.connect();
    walletPubkey = resp.publicKey;
    onConnected();
  } catch (e) {
    toast("e", "ERROR DE CONEXIÓN", e.message);
  }
}

function onConnected() {
  el("btn-wallet").classList.add("on");
  el("wallet-label").textContent = `DESCONECTAR · ${short(walletPubkey, 4)}`;
  el("wallet-dot").style.display = "inline-block";
  el("net-status").style.display = "flex";
  el("welcome").style.display    = "none";
  el("dashboard").style.display  = "block";
  el("user-addr-short").textContent = short(walletPubkey, 6);
  el("my-tickets-count").textContent = myTickets;
  fetchState();
  startRefresh();
}

function disconnectWallet() {
  window.solana?.disconnect();
  walletPubkey = null; lotteryState = null; myTickets = 0;
  stopRefresh();
  el("btn-wallet").classList.remove("on");
  el("wallet-label").textContent = "CONECTAR WALLET";
  el("wallet-dot").style.display = "none";
  el("net-status").style.display = "none";
  el("welcome").style.display    = "flex";
  el("dashboard").style.display  = "none";
}

// ══════════════════════════════════════════════
//  AUTO-REFRESH + COUNTDOWN (sin cambios)
// ══════════════════════════════════════════════
function startRefresh() {
  stopRefresh();
  refreshTimer = setInterval(fetchState, 10000);
  resetCountdown();
}
function stopRefresh() {
  clearInterval(refreshTimer);
  clearInterval(countdownInt);
}
function resetCountdown() {
  clearInterval(countdownInt);
  countdownVal = 10;
  el("countdown").textContent = "10s";
  countdownInt = setInterval(() => {
    countdownVal--;
    el("countdown").textContent = countdownVal + "s";
    if (countdownVal <= 0) { countdownVal = 10; el("countdown").textContent = "10s"; }
  }, 1000);
}

// ══════════════════════════════════════════════
//  HELPERS (sin cambios)
// ══════════════════════════════════════════════
function el(id) { return document.getElementById(id); }
function setBusy(id, state) { const btn = el(id); if (!btn) return; btn.disabled = state; }
function copyAddr() {
  if (!walletPubkey) return;
  navigator.clipboard.writeText(walletPubkey.toBase58()).then(() => {
    toast("i", "COPIADO", "Dirección copiada al portapapeles");
  });
}
function toast(type, lbl, msg) {
  const d = document.createElement("div");
  d.className = `tst ${type}`;
  d.innerHTML = `<div class="tst-lbl">${lbl}</div><div class="tst-msg">${msg}</div>`;
  el("toasts").prepend(d);
  setTimeout(() => d.remove(), 6000);
}

// ══════════════════════════════════════════════
//  INIT (sin cambios)
// ══════════════════════════════════════════════
window.addEventListener("load", () => {
  if (window.solana?.isPhantom && window.solana.isConnected) {
    window.solana.connect({ onlyIfTrusted: true }).then(r => {
      walletPubkey = r.publicKey;
      onConnected();
    }).catch(() => {});
  }
});
window.solana?.on?.("disconnect", disconnectWallet);
window.solana?.on?.("accountChanged", (pk) => {
  if (pk) { walletPubkey = pk; el("user-addr-short").textContent = short(pk, 6); fetchState(); }
  else disconnectWallet();
});
</script>
</body>
</html>
